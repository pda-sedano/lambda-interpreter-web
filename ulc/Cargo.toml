[package]
name = "ulc"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"  # wasm-bindgen 0.2.129 needs 1.81+
description = "Untyped lambda calculus interpreter (normal-order reduction, de Bruijn indices) with WebAssembly bindings"
repository = "https://github.com/pda-sedano/lambda-interpreter-web"
publish = false

[lib]
# cdylib -> the .wasm module; rlib -> usable as a normal Rust dependency and for `cargo test`
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
# An interpreter lives or dies by its inner loop, so optimize for speed rather than size.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
